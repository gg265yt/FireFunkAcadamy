const P={
lernen:()=>`<div class="card"><h1>Lernpfad</h1><p class="mu">Alle Lektionen sind frei wählbar – ohne Anmeldung, ohne Limits.</p></div>`+W.map(w=>{const d=w.L.filter(l=>S.done[l.id]).length;return `<section class="card"><h2>${w.e} ${esc(w.t)}</h2><div class="bar"><i style="width:${d/w.L.length*100}%"></i></div><p class="mu">${d} von ${w.L.length} Lektionen abgeschlossen</p>${w.L.map(l=>`<button class="opt" data-a="lesson" data-id="${l.id}">${S.done[l.id]?'✅':'▶️'} ${esc(l.t)}<br><span class="mu">${esc(l.g)}${S.done[l.id]?' · Bestwert '+S.done[l.id].best+' %':''}</span></button>`).join('')}</section>`}).join('')+disc,
ueben:()=>`<div class="card"><h1>Üben</h1><p class="mu">Freies Training, beliebig oft wiederholbar.</p>${W.map(w=>`<button class="opt" data-a="prac" data-id="${w.id}">${w.e} ${esc(w.t)}</button>`).join('')}<button class="opt" data-a="prac" data-id="wrong">🔁 Falsch beantwortete wiederholen (${S.wrong.length})</button><p id="nt" role="status" class="mu"></p></div>`,
sim:()=>`<div class="card"><h1>Funk-Simulator</h1><p class="mu">Simulierte Gespräche mit einem virtuellen Gegenüber – keine echte Funkübertragung.</p>${SC.map((s,i)=>`<button class="opt" data-a="sim" data-id="${i}">📻 ${esc(s.t)}</button>`).join('')}</div>`,
test:()=>`<div class="card"><h1>Wissenstest</h1><label>Themenbereich<select id="tw"><option value="all">Gemischt</option>${W.map(w=>`<option value="${w.id}">${esc(w.t)}</option>`).join('')}</select></label><label>Schwierigkeitsgrad<select id="td"><option value="all">Alle (${A.length} Fragen)</option>${[1,2,3,4,5].map(d=>`<option value="${d}">${DN[d]} (${A.filter(t=>t.d===d).length} Fragen)</option>`).join('')}</select></label><label>Anzahl der Fragen<select id="tn">${[5,10,20,30].map(n=>`<option>${n}</option>`).join('')}</select></label><label><input type="checkbox" id="tx"> Nur falsch beantwortete Fragen</label><br><label><input type="checkbox" id="tnew"> Nur neue Fragen (noch nie beantwortet)</label><br><button class="btn" data-a="test">Test starten</button><p id="nt" role="status" class="mu"></p></div>`,
stat(){const l=lvl(),tp=Object.entries(S.topics),days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return iso(d)}),mx=Math.max(1,...days.map(d=>Number(S.log[d])||0));
return `<div class="card"><h1>Statistik</h1>${S.n?'':'<p>Noch keine Lernaktivität – starte unter „Lernen“ eine Lektion.</p>'}<p>🏅 <b>${esc(l.n)}</b> · ${S.xp} XP${l.next?` (nächste Stufe ab ${l.next[0]} XP)`:''}</p><p>✅ ${nd()} von ${NL} Lektionen · ${S.n} Antworten, ${S.ok} richtig (${S.n?Math.round(S.ok/S.n*100):0} %) · 🔥 Serie: ${streak()} Tage</p></div>
<div class="card"><h2>XP der letzten 7 Tage</h2><div style="display:flex;align-items:flex-end;gap:6px;height:90px">${days.map(d=>`<div style="flex:1;text-align:center"><div style="background:var(--blue);height:${(Number(S.log[d])||0)/mx*60}px;border-radius:6px 6px 0 0" title="${d}"></div><span class="mu">${d.slice(8)}</span></div>`).join('')}</div></div>
<div class="card"><h2>Abzeichen</h2>${BD.map(b=>`<p style="opacity:${b[2]()?1:.45}">${b[0]} ${b[1]} ${b[2]()?'✔':'(noch offen)'}</p>`).join('')}</div>
<div class="card"><h2>Themen mit Fehlern</h2>${tp.length?tp.map(([k,v])=>`<p>${esc(WN[k]||k)}: ${v.n-v.ok} Fehler von ${v.n}</p><div class="bar"><i style="background:var(--bad);width:${(v.n-v.ok)/Math.max(1,v.n)*100}%"></i></div>`).join(''):'<p class="mu">Noch keine Daten.</p>'}</div>
<div class="card"><h2>Beste Ergebnisse</h2>${nd()?Object.entries(S.done).map(([k,v])=>`<p>${esc(LS[k]?LS[k].t:k)}: ${v.best} % (${v.n}× abgeschlossen)</p>`).join(''):'<p class="mu">Noch keine Lektion abgeschlossen.</p>'}</div>`},
ref:()=>`<div class="card"><h1>Nachschlagewerk</h1><label>Suche<input id="q" type="search" placeholder="Begriff suchen …"></label><label>Kategorie<select id="cat"><option value="">Alle</option>${[...new Set(G.map(g=>g.c))].map(c=>`<option>${esc(c)}</option>`).join('')}</select></label></div><div id="rl"></div>${disc}`,
set:()=>`<div class="card"><h1>Einstellungen</h1><h3>Darstellung</h3><button class="opt" style="width:auto;display:inline-block" data-a="th" data-id="light">☀️ Hell</button> <button class="opt" style="width:auto;display:inline-block" data-a="th" data-id="dark">🌙 Dunkel</button><h3>Datensicherung</h3><p class="mu">Dein Fortschritt liegt nur in diesem Browser. Es werden keine Daten an einen Server gesendet.</p><button class="btn" data-a="exp">Fortschritt exportieren</button><label class="opt" style="margin-top:10px">Fortschritt importieren<input type="file" id="imp" accept=".json,application/json"></label><button class="opt" data-a="reset">🗑️ Fortschritt zurücksetzen</button><p id="nt" role="status"></p></div>${disc}`};
const RT=[['lernen','Lernen','📚'],['ueben','Üben','🔁'],['sim','Simulator','📻'],['test','Test','📝'],['stat','Statistik','📊'],['ref','Lexikon','📖'],['set','Mehr','⚙️']];
function route(){try{speechSynthesis.cancel()}catch(e){}R=null;SIM=null;const h=location.hash.slice(1),r=Object.hasOwn(P,h)?h:'lernen';$('#nav').innerHTML=RT.map(x=>`<a href="#${x[0]}" ${x[0]===r?'aria-current="page"':''}><b aria-hidden="true">${x[2]}</b>${x[1]}</a>`).join('');$('#app').innerHTML=P[r]();if(r==='ref')refList();hd();theme();scrollTo(0,0)}

const X={

go(b){const l=LS[b.dataset.id];run(l.T,l.t,p=>{const d=S.done[l.id]||(S.done[l.id]={best:0,n:0});d.best=Math.max(d.best,p);d.n++;return 20})},
prac(b){const id=b.dataset.id,pool=A.filter(t=>id==='wrong'?S.wrong.includes(t.id):t.w===id);if(!pool.length)return $('#nt').textContent='Keine falsch beantworteten Aufgaben – stark!';run(shuf(pool).slice(0,10),id==='wrong'?'Fehler wiederholen':WN[id])},
test(){const w=$('#tw').value,d=$('#td').value,pool=A.filter(t=>(w==='all'||t.w===w)&&(d==='all'||t.d===+d)&&(!$('#tx').checked||S.wrong.includes(t.id))&&(!$('#tnew').checked||!S.seen.includes(t.id)));if(!pool.length)return $('#nt').textContent='Keine passenden Fragen gefunden.';const n=+$('#tn').value;let q=[];while(q.length<n)q=q.concat(shuf(pool));run(q.slice(0,n),'Wissenstest')},
pick(b){if(!R||R.chk)return;const t=R.tasks[R.i],i=b.dataset.i;if(t.y==='tf')R.sel=[i==='true'];else if(t.y==='mc'){const k=+i;R.sel=t.a.length>1?(R.sel.includes(k)?R.sel.filter(x=>x!==k):[...R.sel,k]):[k]}else R.sel.push(+i);draw()},
say(){const u=new SpeechSynthesisUtterance(R.tasks[R.i].s);u.lang='de-DE';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)},oreset(){R.sel=[];draw()},check,next(){R.i++;nextT()},again(){run(R.tasks,R.title,R.onEnd)},
sim(b){SIM={id:+b.dataset.id,s:SC[+b.dataset.id],i:0,ok:0,log:[],bad:[],fin:false};sStep()},
sp(b){if(!SIM.chk){SIM.sel=+b.dataset.i;sd()}},
ss(){const m=SIM;if(m.sel<0)return;const o=m.o[m.sel],st=m.s.st[m.i];m.chk=true;m.log.push('Du: '+o[0],(o[1]?'✔ ':'✘ ')+o[2],st.r);if(o[1])m.ok++;else m.bad.push(o[2]);rec({id:'sim-'+m.id+'-'+m.i,w:'sim',y:'mc'},!!o[1]);sd()},
sn(){SIM.i++;SIM.i>=SIM.s.st.length?se():sStep()},
copy(b){const t=G[b.dataset.i].m;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>b.textContent='✔ Kopiert',()=>b.textContent='Kopieren nicht möglich – bitte Text markieren')},
th(b){S.theme=b.dataset.id;save();theme()},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='firefunk-fortschritt.json';a.click()},
};
X.reset=function(){if(confirm('Wirklich den gesamten Lernstand löschen? Das kann nicht rückgängig gemacht werden.')){S=def();save();route()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(X[a])X[a](b)});
document.addEventListener('input',e=>{if(e.target.id==='q'||e.target.id==='cat')refList()});
document.addEventListener('change',e=>{if(e.target.id==='cat')refList();if(e.target.id!=='imp')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!valid(o))throw 0;S={...def(),...o};save();hd();theme();$('#nt').textContent='Fortschritt importiert ✔'}catch(x){$('#nt').textContent='Die Datei ist ungültig. Bitte wähle eine zuvor exportierte FireFunk-Datei (.json).'}};r.onerror=()=>{$('#nt').textContent='Die Datei konnte nicht gelesen werden.'};r.readAsText(f)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='in'&&e.target.tagName==='INPUT'&&R)check()});
addEventListener('hashchange',route);route();
